<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="주간보고">
<title>HS TECH 주간보고 v0.76</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f5f7fa;--card:#ffffff;--line:#e2e8f0;--line2:#cbd5e1;--text:#111827;--sub:#4b5563;--mute:#6b7280;
  --navy:#1a3a5c;--navy2:#0f172a;--gold:#C8A24A;--teal:#14b8a6;
  --acc:#1a3a5c;--acc-bg:#e8eef5;--ok:#059669;--ok-bg:#ecfdf5;--warn:#b45309;--warn-bg:#fffbeb;--bad:#dc2626;--bad-bg:#fef2f2;
  --meet:#3f2fc2;--meet-bg:#e4e0ff;--quote:#0b6b52;--quote-bg:#cff1e3;--won:#9a4200;--won-bg:#ffe4c7;--ship:#8f2764;--ship-bg:#fbd9e8;--tech:#125a8f;--tech-bg:#d4e8fb;--cal:#4a5a1c;--cal-bg:#e3ecc4;--etc:#3f3f46;--etc-bg:#e7e7ea;
  --r:8px;--rl:12px;--shadow:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:13.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy)}
.app{max-width:1120px;margin:0 auto;padding:0 16px 96px}
/* 상단 바 — 견적기 톤 */
header{position:sticky;top:0;z-index:20;background:var(--navy2);color:#fff;margin:0 -16px;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--gold)}
.logo{font-weight:800;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.logo b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--gold);color:var(--navy2);font-size:12px;font-weight:800}
.logo .sub{color:#C9D4E3!important;font-weight:500}
.spacer{flex:1}
header .pill{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#C9D4E3}
header .pill.on{background:#fff;color:var(--navy2);border-color:#fff}
header .pill.ghost{background:transparent;border:none;color:#C9D4E3;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:12.5px;color:var(--sub);font-weight:600}
.pill.on{border-color:var(--navy);color:var(--navy);background:var(--acc-bg)}
.iconbtn{width:32px;height:32px;border-radius:var(--r);border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;color:var(--sub)}
nav.tabs{display:flex;gap:2px;margin:14px 0;border-bottom:2px solid var(--navy)}
nav.tabs button{border:none;background:transparent;padding:9px 16px;color:var(--sub);font-weight:700;font-size:13.5px;border-radius:var(--r) var(--r) 0 0;position:relative;top:0}
nav.tabs button.on{background:var(--navy);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--shadow)}
.sec{padding:16px 18px}
h1{font-size:19px;margin:0;color:var(--navy);letter-spacing:-.01em}
h2{font-size:14px;margin:0 0 10px;color:var(--navy);padding-bottom:6px;border-bottom:2px solid var(--navy);display:flex;align-items:center;gap:8px}
.sub{color:var(--sub);font-size:12.5px}
.mute{color:var(--mute)}
.row{display:flex;align-items:center;gap:10px}
.grid{display:grid;gap:12px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:4px;white-space:nowrap}
.tx0{background:var(--meet-bg);color:var(--meet)}.tx1{background:var(--quote-bg);color:var(--quote)}.tx2{background:var(--won-bg);color:var(--won)}.tx3{background:var(--ship-bg);color:var(--ship)}
.tx4{background:var(--tech-bg);color:var(--tech)}.tx5{background:var(--cal-bg);color:var(--cal)}.tx6{background:var(--etc-bg);color:var(--etc)}.tx7{background:#e0f2fe;color:#0369a1}.tx8{background:#fce7f3;color:#9d174d}.tx9{background:#ecfccb;color:#3f6212}
.s-예정{background:var(--etc-bg);color:var(--sub)}.s-진행중{background:#e0f2fe;color:#0369a1}.s-완료{background:var(--ok-bg);color:var(--ok)}.s-블로커,.s-이슈{background:var(--bad-bg);color:var(--bad)}
.s-해결{background:var(--ok-bg);color:var(--ok)}
.aispin{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:6px;vertical-align:-1px;animation:aisp .8s linear infinite}@keyframes aisp{to{transform:rotate(360deg)}}
.cell .mini{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}.cell .mb{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:999px;background:var(--etc-bg);color:var(--etc);line-height:1.4}.cell .mb.it{background:var(--meet-bg);color:var(--meet)}.cell .mb.iss{background:var(--bad-bg);color:var(--bad)}.cell .mb.in.late{background:var(--bad-bg);color:var(--bad)}.cell .mb.in.ship{background:var(--acc-bg);color:var(--acc)}.cell .mb.in.cus{background:var(--ok-bg);color:var(--ok)}
@media(max-width:640px){#calGrid .cell{min-height:52px;padding:3px}#calGrid .cell .d{font-size:12px}}
.lnote{margin-top:4px;font-size:12.5px;color:#7c2d12;background:#fff7ed;border-left:3px solid #f59e0b;padding:4px 8px;border-radius:0 6px 6px 0;white-space:pre-wrap}
.tag.ghost{opacity:.3;background:transparent;border:1px dashed var(--line2);color:var(--sub)}.item:hover .tag.ghost{opacity:.85}
/* 요일 스트립 */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.day{border:1px solid var(--line2);border-radius:var(--r);padding:7px 6px;text-align:center;background:var(--card);cursor:pointer;position:relative}
.day small{display:block;color:var(--sub);font-size:11px;font-weight:700}
.day b{font-size:17px;font-weight:800}
.day.on{border-color:var(--navy);background:var(--navy);color:#fff}.day.on small{color:#C9D4E3}
.day.today:not(.on)::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.day .n{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:10px;background:var(--gold);color:var(--navy2);border-radius:999px;padding:0 6px;font-weight:800}
/* 빠른 입력 */
.quick{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line2);border-radius:var(--rl);padding:5px 5px 5px 14px}
.quick input,.quick textarea{flex:1;border:none;background:transparent;outline:none;font-size:14px;min-width:0;resize:none;font-family:inherit;line-height:1.4;padding:6px 0;max-height:120px}
.quick button{border:none;background:var(--navy);color:#fff;border-radius:var(--r);padding:9px 16px;font-weight:700}
.hint{font-size:12px;color:var(--sub);margin:6px 2px 0}
.hint code{background:var(--etc-bg);padding:0 5px;border-radius:4px;font-family:inherit}
/* 업무 카드 */
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:11px 14px;border-top:1px solid var(--line);align-items:start}
.item:first-child{border-top:none}
.item .main{min-width:0}
.item .title{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .title .end,.item .title .prod{color:var(--sub);font-weight:500}
.item .body{color:var(--text);font-size:13px;margin-top:2px;word-break:keep-all}
.item .meta{font-size:11.5px;color:var(--mute);margin-top:3px}
.item .st{border:none;cursor:pointer}
.item .del{opacity:0;border:none;background:none;color:var(--mute);padding:2px 6px}
.item:hover .del{opacity:1}
.empty{padding:26px;text-align:center;color:var(--mute);font-size:13px}
.cand{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:13px}
.cand button{border:1px solid var(--line2);background:transparent;border-radius:var(--r);padding:4px 10px;font-size:12.5px}
/* 칸반 */
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.col h3{font-size:12.5px;color:var(--navy);margin:0 0 8px;display:flex;justify-content:space-between;border-bottom:2px solid var(--navy);padding-bottom:5px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;margin-bottom:8px;font-size:13px}
.kcard .who{font-size:11.5px;color:var(--sub);margin-top:4px}
.kcard{position:relative}.kcard.new::before{content:'NEW';position:absolute;top:-7px;right:8px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.3px;padding:1px 6px;border-radius:999px}
.kcard .joinbtn{float:right;border:1px solid var(--line2);background:#fff;color:var(--navy);border-radius:999px;font-size:11px;padding:2px 8px;margin-left:6px;cursor:pointer}.kcard .joinbtn:active{background:var(--acc-bg)}
.kcard .carry{display:inline-block;background:var(--bad-bg);color:var(--bad);border-radius:999px;font-size:10.5px;font-weight:700;padding:0 7px;margin-left:4px}
.kcard.block{border-left:3px solid var(--bad)}
/* 일정 */
.calwrap{display:block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));overflow:hidden}
.cal .dh{padding:7px 0;text-align:center;font-size:12px;font-weight:800;color:var(--navy);background:#eef2f7;border-bottom:2px solid var(--navy)}
.cal .dh.sun{color:var(--bad)}.cal .dh.sat{color:#1d4ed8}
.cell{min-height:112px;border-left:1px solid var(--line);border-top:1px solid var(--line);padding:5px;cursor:pointer;background:var(--card)}
.cell:nth-child(7n+1){border-left:none}
.cell.sel{box-shadow:inset 0 0 0 2px var(--navy)}
.cell.out{background:var(--bg);opacity:.5}
.cell.past{opacity:.8}
.cell.today{background:#fdf6e3}
.cell .d{font-size:12px;font-weight:800;color:var(--text);margin-bottom:4px;display:flex;justify-content:space-between}
.cell .d .tod{font-size:10px;color:var(--gold);font-weight:800}
.cell.sun .d{color:var(--bad)}.cell.sat .d{color:#1d4ed8}
.ev{font-size:12px;line-height:1.3;padding:3px 7px;border-radius:4px;margin-bottom:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.in{white-space:normal;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;background:#f1f5f9;padding-left:5px;border-left:3px solid var(--mute);border-radius:0 4px 4px 0;color:var(--text)}
.ev.in.late{border-left-color:var(--bad);background:#fef2f2;color:#991b1b}.ev.in.ship{border-left-color:#1d4ed8;background:#eff6ff;color:#1e3a8a}.ev.in.cus{border-left-color:#15803d;background:#ecfdf3;color:#14532d}.ev.in.done{opacity:.55}
.ev.focus{outline:2px solid var(--gold)}
.ev.fut{background:#fff!important;box-shadow:inset 0 0 0 1px currentColor}
.ev.more{color:var(--mute);background:transparent;padding-left:3px}
.side h2{padding:14px 14px 6px;margin:0 10px}
.side .dayh{font-size:12px;font-weight:800;color:var(--navy);padding:10px 14px 4px;display:flex;gap:6px;align-items:center}
.side .dayh:before{content:"";width:3px;height:11px;background:var(--gold);border-radius:1px}
.side .it{padding:7px 14px 7px 20px;font-size:12.5px;border-top:1px dashed var(--line)}
.side .it .m{color:var(--sub);font-size:11.5px}
.side .it.pk{cursor:pointer}.side .it.pk:hover{background:var(--bg)}
.dd{padding:0 0 8px}
.ddgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;padding:0 10px 8px}
.ddgrid .ev2{margin:0}
.dd .h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 8px;gap:8px;background:var(--navy);color:#fff;border-radius:var(--rl) var(--rl) 0 0;margin-bottom:10px}
.dd .h b{font-size:14px}
.dd .ev2{margin:0 10px 8px;padding:9px 11px;border-radius:var(--r);border:1px solid var(--line);cursor:pointer}
.dd .ev2:hover{border-color:var(--navy)}
.dd .ev2.focus{border-color:var(--gold);box-shadow:0 0 0 2px #f3e6c2}
.dd .ev2 .t1{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:700}
.dd .ev2 .t2{font-size:12.5px;margin-top:3px;color:var(--text);word-break:keep-all}
.dd .ev2 .t3{font-size:11.5px;color:var(--sub);margin-top:3px}
.dd .ev2.in{background:#f8fafc;border-left:3px solid var(--mute)}
.dd .ev2.in.late{border-left-color:var(--bad)}.dd .ev2.in.ship{border-left-color:#1d4ed8}.dd .ev2.in.cus{border-left-color:#15803d}
.dd .add{margin:0 10px;padding:8px;border:1px dashed var(--line2);border-radius:var(--r);text-align:center;color:var(--navy);font-size:12.5px;cursor:pointer;font-weight:700}
.side details{border-top:1px solid var(--line)}
.side summary{padding:11px 14px;font-weight:800;cursor:pointer;font-size:13px;list-style:none;display:flex;justify-content:space-between;color:var(--navy)}
.side summary:after{content:'›';transform:rotate(90deg);color:var(--sub)}
.side details[open] summary:after{transform:rotate(-90deg)}
@media(max-width:860px){.calwrap{grid-template-columns:1fr}}
@media(max-width:640px){.cell{min-height:64px;padding:4px}.ev{font-size:10px;padding:1px 3px}.cal .dh{font-size:11px}}
/* 보고서 v0.76 */
table.rep.sales{table-layout:auto;font-size:11.5px}
table.rep.sales th{padding:6px 4px;font-size:11px;line-height:1.25}
table.rep.sales td{padding:6px 5px}
table.rep td.nm{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.rep td.bh{font-weight:800;color:#222;background:#f6f8fb;white-space:nowrap}
table.rep td.cm{background:transparent}
.tw{overflow-x:auto}
.subt{font-size:12.5px;font-weight:700;color:var(--navy);margin:12px 0 5px}
.brsel{font-size:11.5px;border:1px solid var(--line2);border-radius:4px;padding:1px 2px;background:#fff;max-width:96px}
.pbr{display:none}
details.oth{margin-top:8px;border:1px dashed var(--line2);border-radius:var(--r);padding:6px 10px}
details.oth summary{cursor:pointer;font-size:12.5px;color:var(--navy);font-weight:700}

.two{display:grid;grid-template-columns:1fr 1fr;border:1px solid #bbb}
.two>div+div{border-left:1px solid #bbb}
.two .th{background:var(--navy);color:#fff;font-weight:700;font-size:12.5px;padding:6px 10px}
.two .th small{color:#C9D4E3;font-weight:500;margin-left:4px}
.two .tb{padding:8px 10px;font-size:12.5px;line-height:1.7;min-height:60px}
.bl{margin-bottom:4px}.bl b{color:var(--navy)}
.bi{display:inline}.bi i{font-style:normal;color:#555;font-size:11.5px}.bi em{font-style:normal;color:#555}.bi u{text-decoration:none;font-size:11px;color:#888}

@media print{.brsel{display:none}.pbr{display:inline}.doc h3.pb{break-before:page}table.rep.sales{font-size:9px}table.rep.sales th{font-size:9.5px}}
/* 보고서 v0.76 */
.rsec h3 .hx{margin-left:auto}
.rsec h3>span{display:flex;align-items:center;gap:8px}
.hx{border:1px solid var(--line2);background:#fff;border-radius:4px;font-size:11px;color:var(--sub);padding:1px 7px;font-weight:600}
.hx:hover{color:var(--bad);border-color:var(--bad)}
.ctitle{font:inherit;font-weight:700;border:none;border-bottom:1px dashed var(--line2);outline:none;min-width:280px;color:#111;background:transparent}
.addc{margin-top:18px;padding:12px;border:1px dashed var(--navy);border-radius:var(--r);text-align:center;color:var(--navy);font-weight:800;cursor:pointer;font-size:13px}
.addc span{font-weight:500;color:var(--sub);font-size:12px}
.addc:hover{background:#f6f8fb}
.tb.ed{outline:none;background:#fffdf5}.tb.ed:focus{box-shadow:inset 0 0 0 2px var(--gold)}
.rst{font-size:11.5px;color:var(--sub);text-align:right;padding:3px 8px;cursor:pointer}
.bars{margin:4px 0 12px;padding:10px 12px;border:1px solid #ddd;border-radius:6px}
.tadd{font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px dashed var(--line);background:#fff;color:var(--navy);margin-left:4px}.tadd.on{border-style:solid;background:var(--navy);color:#fff}
.kpi{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:6px 0 14px;font-size:12px}.kpi .kl{color:#555;font-weight:700;margin-right:2px}.kpi .kc{border:1px solid #d7dde6;border-radius:999px;padding:2px 9px 2px 7px;background:#f6f8fb;white-space:nowrap;-webkit-print-color-adjust:exact;print-color-adjust:exact}.kpi .kc b{color:var(--navy);margin-right:4px;font-size:13px}.kpi .kc.warn{border-color:#f3c3b1;background:#fff4ef}.kpi .kc.warn b{color:#b42318}.kpi .kc.next{border-color:#cfe0d6;background:#f1f8f4}.kpi .kc.next b{color:#1e7a4b}

table.rep.wkt td.ty{white-space:nowrap}table.rep.wkt td.ec.act[contenteditable]:empty:before{content:'팀장 입력'}table.rep.wkt tr.grp td{background:#eef2f7;font-weight:700;color:var(--navy);padding:3px 8px;font-size:11.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}table.rep.wkt .pr{color:#555;font-size:11.5px}table.rep.wkt .wf{font-size:11px;color:#555;margin-left:4px;white-space:nowrap}table.rep.wkt .wf.warn{color:#b42318;font-weight:700}table.rep.wkt .wf.ok{color:#1e7a4b}table.rep.wkt .ln{color:#7c2d12;font-size:11.5px;margin-top:3px}

.br .bt{display:flex;gap:2px;height:16px;align-items:stretch}
.br .seg{height:100%;min-width:2px}
.br .seg:last-child{border-radius:0 4px 4px 0}
.seg.ext,.sw.ext{background:#3366a3}.seg.inn,.sw.inn{background:#3366a3}
.br.excl .seg.ext,.sw.exc{background:#3366a3}

var WR_API='https://script.google.com/macros/s/AKfycby4GCq8UW7OOVHQdw1XOf2mcyGevz0mcfsJ0SwRU8aRV8qhLL9-4UuRFWdxsSOCpEer/exec';   // v0.76 배포 하나로 통일 — 실서버/테스트 구분은 요청의 test 표시로(테스트는 복사본 DB). 옛 실서버 배포(AKfycbzWBftX…)는 보관처리돼 끊김

var WR_MODE=(function(){var q=location.search;if(/[?&]demo\b/.test(q))return 'demo';if(/[?&]live\b/.test(q))return 'live';if(/[?&]test\b/.test(q))return 'test';return location.protocol==='file:'?'test':'live'})();
(function(){

  var url=WR_MODE==='test'?WR_API_TEST:WR_API,isTest=WR_MODE==='test';
  function call(fn,args,ok,fail){
    fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args,test:isTest})})
      .then(function(r){if(!r.ok)throw new Error('서버 응답 '+r.status);return r.text()})
      .then(function(t){var j;try{j=JSON.parse(t)}catch(e){throw new Error('서버 연결 실패 — 잠시 후 다시 시도')}
        if(j&&j.__err)throw new Error(j.__err);return j?j.__res:null})
      .then(function(v){if(ok)ok(v)},function(e){if(fail)fail(e);else console.error(e)});

    if(k==='withSuccessHandler')return function(f){return runner(f,fail)};

      gs('wrAiKeywords',names).then(function(y){bAi.disabled=false;bAi.textContent='✨ AI 키워드 추천';if(!y.ok){toast(y.msg||'추천 실패');return}var n=0;rows.forEach(function(r){var ks=(y.keys||{})[r.name];if(!ks||!ks.length)return;var have=r.keys.split(/[,，]/).map(function(x){return x.trim()}).filter(Boolean);ks.forEach(function(k){if(have.indexOf(k)<0){have.push(k);n++}});r.keys=have.join(', ')});draw();toast(n?'키워드 '+n+'개 채웠어요 — 보고 고친 뒤 저장':'추가할 키워드가 없어요')}).catch(function(e){bAi.disabled=false;bAi.textContent='✨ AI 키워드 추천';toast('추천 실패: '+e.message)})};
    [].forEach.call(sh.querySelectorAll('.rr'),function(rw){var i=+rw.dataset.i;rw.querySelector('.up').onclick=function(){read();if(i>0){var t=rows[i-1];rows[i-1]=rows[i];rows[i]=t}draw()};rw.querySelector('.dn').onclick=function(){read();if(i<rows.length-1){var t=rows[i+1];rows[i+1]=rows[i];rows[i]=t}draw()};rw.querySelector('.rm').onclick=function(){read();if(rows.length<=2){toast('구분은 2개 이상 있어야 합니다');return}rows.splice(i,1);draw()}});
    sh.querySelector('#tySave').onclick=function(){read();var rs=rows.filter(function(r){return r.name});if(rs.length<2){toast('구분은 2개 이상');return}
      var names=rs.map(function(r){return r.name});if(names.some(function(n,k){return names.indexOf(n)!==k})){toast('같은 이름이 두 번 있어요');return}
      var kmap={};rs.forEach(function(r){var ks=r.keys.split(/[,，\n]/).map(function(x){return x.trim()}).filter(Boolean);if(ks.length)kmap[r.name]=ks});
      var ren=rs.filter(function(r){return r.orig&&r.orig!==r.name}).map(function(r){return{from:r.orig,to:r.name}});
      if(ren.length&&!confirm(ren.map(function(r){return '"'+r.from+'" → "'+r.to+'"'}).join('\n')+'\n\n이름을 바꾸면 이미 적은 업무도 새 이름으로 바뀝니다. 진행할까요?'))return;
      gs('wrSaveTypes',names,kmap,ren).then(function(y){if(!y.ok){toast(y.msg);return}S.boot.types=names;S.boot.typeKeys=kmap;ren.forEach(function(r){S.items.forEach(function(i){var a=typesOf(i);if(a.indexOf(r.from)>=0)i.type=a.map(function(x){return x===r.from?r.to:x}).join('+')})});close();toast('구분을 저장했습니다'+(y.moved?' · 기존 업무 '+y.moved+'건 이름 변경':''));renderAll();if(after)after()})};
  };draw();
}

/* ───────── 주제 라벨 관리 ───────── */

    var wrap=el('div','modal show');wrap.style.zIndex=60;var sh=el('div','sheet');sh.style.maxWidth='720px';wrap.appendChild(sh);document.body.appendChild(wrap);

      '<button class="btn sm" id="lbAdd" style="margin:8px 0 14px">+ 라벨 추가</button>'+
      '<div class="row"><span class="sub">저장하면 모든 팀원·모든 주에 적용됩니다.</span><div class="spacer"></div><button class="btn primary" id="lbSave">저장</button></div>';
      var read=function(){[].forEach.call(sh.querySelectorAll('.rr'),function(rw){var l=labs[+rw.dataset.i];l.name=rw.querySelector('.rn').value.trim()||l.name;var c=rw.querySelector('.rc');if(c)l.carry=c.checked;var t=rw.querySelector('.rt');if(t)l.tmpl=t.value})};
      $('#lbX').onclick=close;
      $('#lbAdd').onclick=function(){read();labs.push({id:'l'+Date.now().toString(36),name:'',kind:'free',tmpl:'',carry:false});draw();setTimeout(function(){var a=sh.querySelectorAll('.rn');a[a.length-1].focus()},30)};
      [].forEach.call(sh.querySelectorAll('.rr'),function(rw){var i=+rw.dataset.i;rw.querySelector('.up').onclick=function(){read();if(i>0){var t=labs[i-1];labs[i-1]=labs[i];labs[i]=t}draw()};rw.querySelector('.dn').onclick=function(){read();if(i<labs.length-1){var t=labs[i+1];labs[i+1]=labs[i];labs[i]=t}draw()};var rm=rw.querySelector('.rm');if(rm)rm.onclick=function(){read();if(!confirm('\''+labs[i].name+'\' 라벨을 지울까요? 이미 만든 항목은 남습니다.'))return;labs.splice(i,1);draw()}});
      $('#lbSave').onclick=function(){read();if(labs.some(function(l){return !l.name})){toast('이름이 빈 라벨이 있습니다');return}gs('wrSaveLabels',labs).then(function(y){if(y.ok){close();toast('라벨을 저장했습니다');S.report=null;loadReport()}else toast(y.msg)})};
    };draw();
  });
}

/* ───────── ERP 매출 올리기 (이카운트 판매조회 엑셀) ───────── */
function numv(v){return typeof v==='number'?v:Number(String(v==null?'':v).replace(/[^\d.-]/g,''))||0}
function loadXLSX(){return new Promise(function(res,rej){if(window.XLSX)return res();var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=function(){res()};s.onerror=function(){rej(new Error('엑셀 읽기 도구를 못 불러왔습니다 (인터넷 연결 확인)'))};document.head.appendChild(s)})}
function parseErp(aoa){
  var hr=-1;for(var i=0;i<Math.min(aoa.length,15);i++){if(aoa[i].some(function(c){return /^일자/.test(String(c).trim())})){hr=i;break}}
  if(hr<0)return{rows:[]};
  var H=aoa[hr].map(function(c){return String(c).trim()}),ix=function(re){for(var j=0;j<H.length;j++)if(re.test(H[j]))return j;return -1};
  var cNo=ix(/^일자/),cGrp=(function(){for(var j=0;j<H.length;j++)if(/(구분|그룹|분류)/.test(H[j])&&!/거래유형|품목/.test(H[j]))return j;return -1})(),cCust=ix(/거래처(명|$)/)>=0?ix(/거래처(명|$)/):ix(/거래처/),cItem=ix(/품목명|품목$|품명/)>=0?ix(/품목명|품목$|품명/):ix(/품목/),cIgrp=ix(/품목\s*(그룹|분류)|제품\s*(그룹|분류)|그룹[1-3]?$/),cCode=ix(/품목\s*코드/),cMemo=(function(){var r=[];for(var j=0;j<H.length;j++)if(/창고|적요|프로젝트|비고|메모|참고|부서|담당/.test(H[j]))r.push(j);return r})(),cSup=ix(/공급가/),cTot=ix(/합계|금액/),cType=ix(/거래유형/);
  var rows=[],seq={},from='',to='';
  for(var r=hr+1;r<aoa.length;r++){var a=aoa[r],no=String(a[cNo]||'').trim();var m=no.match(/^(\d{4})[\/.\-](\d{2})[\/.\-](\d{2})(?:\s*-\s*(\d+))?$/);if(!m)continue;m[4]=m[4]||'0';
    var date=m[1]+'-'+m[2]+'-'+m[3],vk=m[1]+m[2]+m[3]+'-'+m[4];seq[vk]=(seq[vk]||0)+1;
    var type=cType>=0?String(a[cType]||''):'',tot=cTot>=0?numv(a[cTot]):0,sup=cSup>=0?numv(a[cSup]):(/직수출|영세|면세/.test(type)?tot:Math.round(tot/1.1));
    var item=cItem>=0?String(a[cItem]||''):'';
    rows.push({id:vk+'#'+seq[vk],date:date,cust:cCust>=0?String(a[cCust]||''):'',item:item,code:cCode>=0?String(a[cCode]||''):'',igrp:cIgrp>=0?String(a[cIgrp]||'').trim():'',memo:cMemo.map(function(j){return String(a[j]||'')}).join(' ').trim(),amt:sup,total:tot,type:type,grp:cGrp>=0&&cGrp!==cIgrp?String(a[cGrp]||'').trim():''});
    if(!from||date<from)from=date;if(!to||date>to)to=date;}
  return{rows:rows,from:from,to:to,hasSupply:cSup>=0,hasGrp:cGrp>=0,grpName:cGrp>=0?H[cGrp]:'',hasIgrp:cIgrp>=0,byItem:!/No/i.test(H[cNo])};
}
function uploadCustMap(done){
  var inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls';
  inp.onchange=function(){var f=inp.files[0];if(!f)return;toast('거래처 목록 읽는 중…');
    loadXLSX().then(function(){return f.arrayBuffer()}).then(function(buf){
      var wb=XLSX.read(buf,{type:'array'});var aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
      var hr=-1,cN=-1,cG=-1;for(var i=0;i<Math.min(aoa.length,15)&&hr<0;i++){var H=aoa[i].map(function(c){return String(c).trim()});var n=-1,g=-1;H.forEach(function(c,j){if(n<0&&/거래처명|^거래처$|상호|업체명/.test(c))n=j;if(g<0&&/(구분|그룹|분류)/.test(c)&&!/거래유형|코드/.test(c))g=j});if(n>=0&&g>=0){hr=i;cN=n;cG=g}}
      if(hr<0){toast('\'거래처명\' 열과 \'구분(그룹)\' 열을 찾지 못했습니다');return}
      var list=[];for(var r=hr+1;r<aoa.length;r++){var cu=String(aoa[r][cN]||'').trim(),gg=String(aoa[r][cG]||'').trim();if(cu&&gg)list.push({cust:cu,grp:gg})}
      if(!list.length){toast('구분이 적힌 거래처가 없습니다');return}
      return gs('wrSaveCustMap',list).then(function(x){if(!x.ok){toast('저장 실패: '+x.msg);return}toast('거래처 '+x.count+'곳 구분 반영');if(done)done();S.report=null;loadReport()});
    }).catch(function(e){toast(e.message||String(e))});
  };inp.click();
}
function uploadErp(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls';
  inp.onchange=function(){var f=inp.files[0];if(!f)return;toast('엑셀 읽는 중…');
    loadXLSX().then(function(){return f.arrayBuffer()}).then(function(buf){
      var wb=XLSX.read(buf,{type:'array'});var aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
      var p=parseErp(aoa);if(!p.rows.length){toast('판매 자료를 못 찾았습니다 — 이카운트 판매조회 엑셀인지 확인해 주세요');return}
      var meta={from:p.from,to:p.to,count:p.rows.length,file:f.name,at:S.boot.now||'',supply:p.hasSupply,grp:p.grpName};
      return gs('wrSaveSales',p.rows,meta).then(function(x){if(!x.ok){toast('저장 실패: '+x.msg);return}toast('매출 '+p.rows.length+'건 반영 ('+p.from+' ~ '+p.to+')'+(p.hasGrp?' · \''+p.grpName+'\' 열로 구분':''));S.report=null;loadReport()});
    }).catch(function(e){toast(e.message||String(e))});
  };inp.click();
}
function noteBox(key,ph){var ta=el('textarea','note');ta.dataset.k=key;ta.placeholder=ph;ta.value=(S.report.notes||{})[key]||'';ta.rows=1;ta.oninput=function(){S.report.notes=S.report.notes||{};S.report.notes[key]=ta.value;saveNotes();ta.style.height='auto';ta.style.height=ta.scrollHeight+'px'};setTimeout(function(){ta.style.height='auto';ta.style.height=Math.max(44,ta.scrollHeight)+'px'},0);var w=el('div',null);w.style.marginTop='10px';w.appendChild(ta);return w}

/* ───────── 지난 보고 ───────── */
function loadHistory(){
  var box=$('#histList');
  gs('wrHistory').then(function(r){box.innerHTML='';if(!r.ok||!r.list.length){box.innerHTML='<div class="empty">아직 마감된 보고가 없습니다. 첫 목요일 16:00 이후 여기에 쌓입니다.</div>';return}
    r.list.forEach(function(h){var row=el('div','hist','<div><b>'+periodText(h.period)+'</b><div class="sub" style="font-size:13px">'+(h.finalAt?'확정 '+esc(h.finalAt)+' · 확정본 그대로 보관':'아직 확정 전'+(h.deadlineAt?' · 마감 '+esc(h.deadlineAt)+'로 미룸':'')+' — 열어서 확정하세요')+'</div></div><span class="row" style="gap:6px"><span class="tag '+(h.finalAt?'s-완료':'s-이슈')+'">'+(h.finalAt?'확정':'미확정')+'</span><button class="btn sm">보기</button></span>');row.onclick=function(){viewPast(h.period)};box.appendChild(row)});
    var back=el('div','hist','<div class="sub">현재 기간으로 돌아가기</div><span>→</span>');back.onclick=function(){S.period=S.boot.current;S.report=null;S.boot.closed=false;renderHeader();gs('wrListItems',S.period).then(function(x){if(x.ok){S.items=x.items;renderAll()}});setView('my')};box.appendChild(back);
  });
}


boot();
