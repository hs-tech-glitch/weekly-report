<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="주간보고">
<!-- v0.86 (HTML만 · GAS v0.56 그대로 · 2026-10-14): 홈 화면 앱 아이콘. 같은 폴더(깃허브)에 weekly-report.webmanifest · icon-weekly-192.png · icon-weekly-512.png 같이 올림. 폰에서 기존 바로가기 지우고 크롬 ⋮ → 앱 설치(홈 화면에 추가)하면 새 아이콘 + 주소창 없이 열림 -->
<!-- v0.97 (GAS v0.58과 세트 · 2026-10-19): 팀 보드 = 월요일 주간 회의 자료 + 회의록. 묶음(이슈→배지)마다 지난주/금주, 줄 안 ✎ 메모(누구나), 이슈 즉석 '해결', 회의록(참석·결정사항·할 일→담당자 업무로), ▶ 회의 모드(전체 화면·→←), 🖨 인쇄. 사람별 건수·합계 표시 없음. 처음 설계: — 색은 묶음 제목 배지와 이슈 빨강만, 이름은 글자. 이번주/다음주 버튼·요약 칸·이름 거르기 없앰: 묶음마다 이번 주 줄 → 선 → 다음 주 줄. 며칠 이어진 업무는 한 줄(10/19~21). 아직 안 한 일은 날짜 앞 ▸. 금액은 묶음 제목에 합계, 줄에는 있을 때만. 글자 한 단계 큼(TV·빔). -->
<!-- v0.96 (HTML만 · GAS v0.57 그대로 · 2026-10-19): 팀 보드를 한 화면으로 통합 — 보기 버튼(회의용·이슈·예정·지난·담당자별·구분별) 없앰. 맨 위 ⚠ 이슈(지난주부터 이어진 것 포함) → 배지(구분)별로 위에서 아래로 쭉, 담당자는 줄 안에 이름 칩으로. 위 이름 칩을 누르면 그 사람 것만(담당자별 대신). 오늘 이후는 '예정' 표시, 요약 칸의 배지를 누르면 그 묶음으로 이동. 여러 배지 붙은 건은 첫 배지 묶음에 한 번만(나머지 배지는 줄에 표시). -->
<!-- v0.95 (HTML만 · GAS v0.57 그대로 · 2026-10-19): (1) 업무 수정에서 끝 날짜(기간)가 안 들어가던 문제 — 며칠 이어진 업무(하루씩 저장됨)를 한 덩어리로 열어 시작~끝을 보여 주고, 끝 날짜를 늘리면 날이 추가·줄이면 빠지고 내용 수정은 그 기간 전체에 반영. '이 날만 고치기'로 하루만 따로 고칠 수도 있음. (2) '같이 가는 팀원' → '같이하는 팀원'. (3) 같이하는 팀원 표시: 미팅/방문 업무는 '동행', 그 밖의 일(견적·납품 준비·기술지원 등)은 '협업'. (4) 팀 보드에 '회의용' 보기(기본): 구분(줄) × 팀원(칸) 표로 이번 주 견적·미팅·납품을 한눈에 — 휴대폰은 구분별 묶음, 견적 줄은 합계 금액. -->
<!-- v0.94 (HTML만 · GAS v0.57 그대로 · 2026-10-18): 주가 바뀌었는데 앱을 안 닫고 두었던 폰(백그라운드에서 다시 켬)도 새 주로 — 다시 켤 때·1분마다 이번 주 월요일이 바뀌었는지 보고, 바뀌었으면 새로 불러옴 -->
<!-- v0.93 (HTML만 · GAS v0.57 그대로 · 2026-10-16): 아이폰 앱 위쪽 — 시계 줄 밑으로 번지는 어두운 그림자가 이름 버튼을 살짝 가리던 것 → 시계 줄 높이의 1/4만큼 더 띄움(안드로이드·PC는 0이라 그대로) -->
<!-- v0.92 (HTML만 · GAS v0.57 그대로 · 2026-10-16): 아이폰 앱 — 화면 위(시계 줄)·아래(홈 막대) 바깥 여백이 밝은 회색으로 보이던 것 → 남색으로. '최신 내용 받는 중' 표시가 안 사라지고 남던 문제(폰을 껐다 켜면 응답이 안 오는 요청에 계속 매달림) → 25초 넘게 응답 없으면 새로 요청하고 표시는 보고서 탭에서만 -->
<!-- v0.91 (HTML만 · GAS v0.57 그대로 · 2026-10-16): 아이폰 홈 화면 앱에서 맨 위(이름 버튼)가 시계·배터리 줄 밑에 깔려 못 누르던 문제 — 위·아래 안전 영역(노치·홈 막대)만큼 띄움. 안드로이드·PC는 그대로 -->
<!-- v0.90 (HTML · GAS v0.58 같이 · 2026-10-15): 지난 보고 — 위에 연도 배지(올해가 맨 앞·기본 선택, 해가 바뀌면 새 연도 배지가 자동으로 생겨 맨 앞). 배지를 누르면 그 해 보고만 월별로. 열자마자 기억해 둔 목록부터 표시 -->
<!-- v0.89 (HTML만 · GAS v0.57 그대로 · 2026-10-15): 인쇄 — 쓴 내용이 적어 종이 아래가 비면, 남는 높이를 주제 칸마다 고르게 나눠 칸을 넓혀 종이를 채움(양쪽 단 높이 맞춤) -->
<!-- v0.88 (HTML · GAS v0.57 같이 · 2026-10-15): 빨리 열기 — 마지막으로 받은 화면(내 업무·보고서)을 이 기기에 기억해 두고 열자마자 바로 보여 준 뒤, 서버 최신 내용이 오면 조용히 바꿔 끼움. 보고서는 처음 들어올 때 미리 받아 둠 -->
<!-- v0.87 (HTML만 · GAS v0.56 그대로 · 2026-10-15): 인쇄 매출현황 막대 위 빈칸 없앰 — 막대 줄을 표 줄과 위아래 끝을 맞춤(누계 머리줄 한 줄로). 인쇄에서 '이번 주 N 수주 …' 요약 줄 숨김 -->

<title>HS TECH 주간보고 v0.97</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f5f7fa;--card:#ffffff;--line:#e2e8f0;--line2:#cbd5e1;--text:#111827;--sub:#4b5563;--mute:#6b7280;
  --navy:#1a3a5c;--navy2:#0f172a;--gold:#C8A24A;--teal:#14b8a6;
  --acc:#1a3a5c;--acc-bg:#e8eef5;--ok:#059669;--ok-bg:#ecfdf5;--warn:#b45309;--warn-bg:#fffbeb;--bad:#dc2626;--bad-bg:#fef2f2;
  --meet:#3f2fc2;--meet-bg:#e4e0ff;--quote:#0b6b52;--quote-bg:#cff1e3;--won:#9a4200;--won-bg:#ffe4c7;--ship:#8f2764;--ship-bg:#fbd9e8;--tech:#125a8f;--tech-bg:#d4e8fb;--cal:#4a5a1c;--cal-bg:#e3ecc4;--etc:#3f3f46;--etc-bg:#e7e7ea;
  --r:8px;--rl:12px;--shadow:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:13.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy)}
.app{max-width:1120px;margin:0 auto;padding:0 16px 96px}
/* 상단 바 — 견적기 톤 */
header{position:sticky;top:0;z-index:20;background:var(--navy2);color:#fff;margin:0 -16px;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:3px solid var(--gold)}
.logo{font-weight:800;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.logo b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--gold);color:var(--navy2);font-size:12px;font-weight:800}
.logo .sub{color:#C9D4E3!important;font-weight:500}
.spacer{flex:1}
header .pill{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#C9D4E3}
header .pill.on{background:#fff;color:var(--navy2);border-color:#fff}
header .pill.ghost{background:transparent;border:none;color:#C9D4E3;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:12.5px;color:var(--sub);font-weight:600}
.pill.on{border-color:var(--navy);color:var(--navy);background:var(--acc-bg)}
.iconbtn{width:32px;height:32px;border-radius:var(--r);border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;color:var(--sub)}
nav.tabs{display:flex;gap:2px;margin:14px 0;border-bottom:2px solid var(--navy)}
nav.tabs button{border:none;background:transparent;padding:9px 16px;color:var(--sub);font-weight:700;font-size:13.5px;border-radius:var(--r) var(--r) 0 0;position:relative;top:0}
nav.tabs button.on{background:var(--navy);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--shadow)}
.sec{padding:16px 18px}
h1{font-size:19px;margin:0;color:var(--navy);letter-spacing:-.01em}
h2{font-size:14px;margin:0 0 10px;color:var(--navy);padding-bottom:6px;border-bottom:2px solid var(--navy);display:flex;align-items:center;gap:8px}
.sub{color:var(--sub);font-size:12.5px}
.mute{color:var(--mute)}
.row{display:flex;align-items:center;gap:10px}
.grid{display:grid;gap:12px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:4px;white-space:nowrap}
.tx0{background:var(--meet-bg);color:var(--meet)}.tx1{background:var(--quote-bg);color:var(--quote)}.tx2{background:var(--won-bg);color:var(--won)}.tx3{background:var(--ship-bg);color:var(--ship)}
.tx4{background:var(--tech-bg);color:var(--tech)}.tx5{background:var(--cal-bg);color:var(--cal)}.tx6{background:var(--etc-bg);color:var(--etc)}.tx7{background:#e0f2fe;color:#0369a1}.tx8{background:#fce7f3;color:#9d174d}.tx9{background:#ecfccb;color:#3f6212}
.s-예정{background:var(--etc-bg);color:var(--sub)}.s-진행중{background:#e0f2fe;color:#0369a1}.s-완료{background:var(--ok-bg);color:var(--ok)}.s-블로커,.s-이슈{background:var(--bad-bg);color:var(--bad)}
.s-해결{background:var(--ok-bg);color:var(--ok)}
.aispin{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:6px;vertical-align:-1px;animation:aisp .8s linear infinite}@keyframes aisp{to{transform:rotate(360deg)}}
.cell .mini{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}.cell .mb{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:999px;background:var(--etc-bg);color:var(--etc);line-height:1.4}.cell .mb.it{background:var(--meet-bg);color:var(--meet)}.cell .mb.iss{background:var(--bad-bg);color:var(--bad)}.cell .mb.in.late{background:var(--bad-bg);color:var(--bad)}.cell .mb.in.ship{background:var(--acc-bg);color:var(--acc)}.cell .mb.in.cus{background:var(--ok-bg);color:var(--ok)}
@media(max-width:640px){#calGrid .cell{min-height:52px;padding:3px}#calGrid .cell .d{font-size:12px}}
.lnote{margin-top:4px;font-size:12.5px;color:#7c2d12;background:#fff7ed;border-left:3px solid #f59e0b;padding:4px 8px;border-radius:0 6px 6px 0;white-space:pre-wrap}
.tag.ghost{opacity:.3;background:transparent;border:1px dashed var(--line2);color:var(--sub)}.item:hover .tag.ghost{opacity:.85}
/* 요일 스트립 */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.day{border:1px solid var(--line2);border-radius:var(--r);padding:7px 6px;text-align:center;background:var(--card);cursor:pointer;position:relative}
.day small{display:block;color:var(--sub);font-size:11px;font-weight:700}
.day b{font-size:17px;font-weight:800}
.day.on{border-color:var(--navy);background:var(--navy);color:#fff}.day.on small{color:#C9D4E3}
.day.today:not(.on)::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.day .n{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:10px;background:var(--gold);color:var(--navy2);border-radius:999px;padding:0 6px;font-weight:800}
/* 빠른 입력 */
.quick{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line2);border-radius:var(--rl);padding:5px 5px 5px 14px}
.quick input,.quick textarea{flex:1;border:none;background:transparent;outline:none;font-size:14px;min-width:0;resize:none;font-family:inherit;line-height:1.4;padding:6px 0;max-height:120px}
.quick button{border:none;background:var(--navy);color:#fff;border-radius:var(--r);padding:9px 16px;font-weight:700}
.hint{font-size:12px;color:var(--sub);margin:6px 2px 0}
.hint code{background:var(--etc-bg);padding:0 5px;border-radius:4px;font-family:inherit}
/* 업무 카드 */
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:11px 14px;border-top:1px solid var(--line);align-items:start}
.item:first-child{border-top:none}
.item .main{min-width:0}
.item .title{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .title .end,.item .title .prod{color:var(--sub);font-weight:500}
.item .body{color:var(--text);font-size:13px;margin-top:2px;word-break:keep-all}
.item .meta{font-size:11.5px;color:var(--mute);margin-top:3px}
.item .st{border:none;cursor:pointer}
.item .del{opacity:0;border:none;background:none;color:var(--mute);padding:2px 6px}
.item:hover .del{opacity:1}
.empty{padding:26px;text-align:center;color:var(--mute);font-size:13px}
.cand{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:13px}
.cand button{border:1px solid var(--line2);background:transparent;border-radius:var(--r);padding:4px 10px;font-size:12.5px}
/* 칸반 */
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.col h3{font-size:12.5px;color:var(--navy);margin:0 0 8px;display:flex;justify-content:space-between;border-bottom:2px solid var(--navy);padding-bottom:5px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;margin-bottom:8px;font-size:13px}
.kcard .who{font-size:11.5px;color:var(--sub);margin-top:4px}
.kcard{position:relative}.kcard.new::before{content:'NEW';position:absolute;top:-7px;right:8px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.3px;padding:1px 6px;border-radius:999px}
.kcard .joinbtn{float:right;border:1px solid var(--line2);background:#fff;color:var(--navy);border-radius:999px;font-size:11px;padding:2px 8px;margin-left:6px;cursor:pointer}.kcard .joinbtn:active{background:var(--acc-bg)}
.kcard .carry{display:inline-block;background:var(--bad-bg);color:var(--bad);border-radius:999px;font-size:10.5px;font-weight:700;padding:0 7px;margin-left:4px}
.kcard.block{border-left:3px solid var(--bad)}
/* v0.95 회의용 보드 */
.meetb{display:block;font-size:14.5px;background:var(--card);border:1px solid var(--line);border-radius:var(--rl);box-shadow:var(--shadow);padding:22px 34px 18px;max-width:1040px;margin:0 auto}
.mtitle{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:6px;border-bottom:2px solid var(--navy2)}
.mwhobar{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}.mwhobar .ml2{font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.06em}
.mtitle h2 .hd{font-weight:600;color:var(--sub);font-size:15px;margin-left:8px}
.mtitle h2{margin:0 0 2px;font-size:21px;letter-spacing:-.01em;color:var(--navy2);border:none;padding:0;display:block}
.mtitle .sub{font-size:13px}.mtitle .dot{color:var(--line2);margin:0 7px}
.msub{display:grid;grid-template-columns:56px minmax(0,1fr);gap:0 6px;align-items:start}
.msub+.msub{margin-top:4px;border-top:1px dashed var(--line2)}
.mwk{font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.08em;padding:10px 0 0 6px}
.msub+.msub .mwk{padding-top:10px}
.msec{padding:14px 0 4px;margin:0}
.msec+.msec{border-top:1px solid var(--line)}
.msec.issec{background:#fff7f7;margin:0 -34px;padding-left:34px;padding-right:34px;border-bottom:1px solid #f1d0d0}
.msec .mh{display:flex;align-items:center;gap:10px;padding-bottom:8px;margin-bottom:2px}
.msec .mh .bar{width:5px;height:17px;border-radius:3px;background:currentColor;flex:none}.msec .mh .bar.s-이슈{color:var(--bad)}
.msec .mh .ht{font-size:16px;font-weight:800;color:var(--navy2);letter-spacing:-.01em}
.msec.issec .mh .ht{color:var(--bad)}
.msec .mh .sub{margin-left:auto;font-size:13px;white-space:nowrap}
.ma{color:var(--text);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.ml{display:grid;grid-template-columns:78px 88px minmax(0,1fr) 104px;gap:12px;align-items:baseline;padding:7px 6px;cursor:pointer;line-height:1.5;position:relative;overflow-wrap:anywhere;border-radius:6px}
.ml+.ml{border-top:1px solid #eef2f6}
.ml:hover{background:var(--acc-bg)}
.ml .md{color:var(--sub);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ml .mwho{font-weight:700;white-space:nowrap}.ml .mww{display:block;font-weight:500;color:var(--mute);font-size:11.5px;line-height:1.3;margin-top:1px}
.msec.noamt .ml{grid-template-columns:78px 88px minmax(0,1fr)}.msec.noamt .ml .ma{display:none}
.ml .mp{color:var(--text)}.ml .m2{color:var(--sub)}.ml .mmain b{font-size:1.03em}
.ml .ma{text-align:right}

      .then(function(r){if(!r.ok)throw new Error('서버 응답 '+r.status);return r.text()})

  for(var r=hr+1;r<aoa.length;r++){var a=aoa[r],no=String(a[cNo]||'').trim();var m=no.match(/^(\d{4})[\/.\-](\d{2})[\/.\-](\d{2})(?:\s*-\s*(\d+))?$/);if(!m)continue;m[4]=m[4]||'0';
    var date=m[1]+'-'+m[2]+'-'+m[3],vk=m[1]+m[2]+m[3]+'-'+m[4];seq[vk]=(seq[vk]||0)+1;
    var type=cType>=0?String(a[cType]||''):'',tot=cTot>=0?numv(a[cTot]):0,sup=cSup>=0?numv(a[cSup]):(/직수출|영세|면세/.test(type)?tot:Math.round(tot/1.1));
    var item=cItem>=0?String(a[cItem]||''):'';
    rows.push({id:vk+'#'+seq[vk],date:date,cust:cCust>=0?String(a[cCust]||''):'',item:item,code:cCode>=0?String(a[cCode]||''):'',igrp:cIgrp>=0?String(a[cIgrp]||'').trim():'',memo:cMemo.map(function(j){return String(a[j]||'')}).join(' ').trim(),amt:sup,total:tot,type:type,grp:cGrp>=0&&cGrp!==cIgrp?String(a[cGrp]||'').trim():''});
    if(!from||date<from)from=date;if(!to||date>to)to=date;}
  return{rows:rows,from:from,to:to,hasSupply:cSup>=0,hasGrp:cGrp>=0,grpName:cGrp>=0?H[cGrp]:'',hasIgrp:cIgrp>=0,byItem:!/No/i.test(H[cNo])};
}
function uploadCustMap(done){
  var inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls';
  inp.onchange=function(){var f=inp.files[0];if(!f)return;toast('거래처 목록 읽는 중…');
    loadXLSX().then(function(){return f.arrayBuffer()}).then(function(buf){
      var wb=XLSX.read(buf,{type:'array'});var aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
      var hr=-1,cN=-1,cG=-1;for(var i=0;i<Math.min(aoa.length,15)&&hr<0;i++){var H=aoa[i].map(function(c){return String(c).trim()});var n=-1,g=-1;H.forEach(function(c,j){if(n<0&&/거래처명|^거래처$|상호|업체명/.test(c))n=j;if(g<0&&/(구분|그룹|분류)/.test(c)&&!/거래유형|코드/.test(c))g=j});if(n>=0&&g>=0){hr=i;cN=n;cG=g}}
      if(hr<0){toast('\'거래처명\' 열과 \'구분(그룹)\' 열을 찾지 못했습니다');return}
      var list=[];for(var r=hr+1;r<aoa.length;r++){var cu=String(aoa[r][cN]||'').trim(),gg=String(aoa[r][cG]||'').trim();if(cu&&gg)list.push({cust:cu,grp:gg})}
      if(!list.length){toast('구분이 적힌 거래처가 없습니다');return}
      return gs('wrSaveCustMap',list).then(function(x){if(!x.ok){toast('저장 실패: '+x.msg);return}toast('거래처 '+x.count+'곳 구분 반영');if(done)done();S.report=null;loadReport()});
    }).catch(function(e){toast(e.message||String(e))});
  };inp.click();
}
function uploadErp(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls';
  inp.onchange=function(){var f=inp.files[0];if(!f)return;toast('엑셀 읽는 중…');
    loadXLSX().then(function(){return f.arrayBuffer()}).then(function(buf){
      var wb=XLSX.read(buf,{type:'array'});var aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
      var p=parseErp(aoa);if(!p.rows.length){toast('판매 자료를 못 찾았습니다 — 이카운트 판매조회 엑셀인지 확인해 주세요');return}
      var meta={from:p.from,to:p.to,count:p.rows.length,file:f.name,at:S.boot.now||'',supply:p.hasSupply,grp:p.grpName};
      return gs('wrSaveSales',p.rows,meta).then(function(x){if(!x.ok){toast('저장 실패: '+x.msg);return}toast('매출 '+p.rows.length+'건 반영 ('+p.from+' ~ '+p.to+')'+(p.hasGrp?' · \''+p.grpName+'\' 열로 구분':''));S.report=null;loadReport()});
    }).catch(function(e){toast(e.message||String(e))});
  };inp.click();
}
function noteBox(key,ph){var ta=el('textarea','note');ta.dataset.k=key;ta.placeholder=ph;ta.value=(S.report.notes||{})[key]||'';ta.rows=1;ta.oninput=function(){S.report.notes=S.report.notes||{};S.report.notes[key]=ta.value;saveNotes();ta.style.height='auto';ta.style.height=ta.scrollHeight+'px'};setTimeout(function(){ta.style.height='auto';ta.style.height=Math.max(44,ta.scrollHeight)+'px'},0);var w=el('div',null);w.style.marginTop='10px';w.appendChild(ta);return w}

/* ───────── 지난 보고 ───────── */
/* v0.90 지난 보고: 연도 배지(올해가 맨 앞·기본) → 그 해 보고만 월별로. 해가 바뀌면 새 연도 배지가 저절로 생기고 맨 앞이 됨 */
$('#histKind').onclick=function(e){var t=e.target.closest('.tag');if(!t)return;S.histKind=t.dataset.k;[].forEach.call(this.children,function(c){c.classList.toggle('on',c===t)});loadHistory()};
function loadHistory(){
  if(S.histKind==='minutes'){loadMinutesList_();return}
  var box=$('#histList'),key='wr_hist_'+WR_MODE,c=cacheGet(key);
  if(c&&c.ok)drawHistory(c.list||[]);else if(!box.querySelector('.hyears'))box.innerHTML='<div class="empty">불러오는 중…</div>';
  gs('wrHistory').then(function(r){if(!r.ok){toast(r.msg||'지난 기록을 못 불러왔어요');return}cachePut(key,r);if(S.view==='history')drawHistory(r.list||[])}).catch(function(e){toast('지난 보고: '+e.message)});
}
/* v0.97 지난 회의록 목록 — 주차별로 참석자·결정사항 미리보기, 열면 그 주의 회의 화면(보드+회의록) */
function loadMinutesList_(){var box=$('#histList');box.innerHTML='<div class="empty">불러오는 중…</div>';
  gs('wrMinutesList').then(function(r){if(S.view!=='history'||S.histKind!=='minutes')return;if(!r.ok){toast(r.msg||'회의록 목록을 못 불러왔어요');return}S._minList=(r.list||[]).slice().sort(function(a,b){return a.period<b.period?1:-1});drawMinutesList_()}).catch(function(e){toast('회의록: '+e.message)})}
function drawMinutesList_(){var box=$('#histList'),list=S._minList||[];box.innerHTML='';
    var curY=String((S.boot&&S.boot.current)||todayKst()).slice(0,4),ys={};ys[curY]=0;list.forEach(function(h){var y=String(h.period).slice(0,4);ys[y]=(ys[y]||0)+1});
    var years=Object.keys(ys).sort(function(a,b){return b<a?-1:1});if(!S.minYear||!(S.minYear in ys))S.minYear=curY;
    var bar=el('div','hyears');years.forEach(function(y){var b=el('button','hy'+(y===S.minYear?' on':''),y+'년<small>'+ys[y]+'건</small>');b.onclick=function(){S.minYear=y;drawMinutesList_()};bar.appendChild(b)});box.appendChild(bar);
    list=list.filter(function(h){return String(h.period).slice(0,4)===S.minYear});
    if(!list.length){box.appendChild(el('div','empty',S.minYear===curY?'저장된 회의록이 아직 없습니다. 월요일 회의 때 주간 회의 화면 아래 \'회의록 저장\'을 누르면 여기에 쌓여요.':'이 해에 남은 회의록이 없습니다.'));return}
    var pm='';list.forEach(function(h){var m=+String(h.period).slice(5,7);if(m!==pm){box.appendChild(el('div','hmon',m+'월'));pm=m}
      var dec=String(h.decisions||'').split('\n').filter(Boolean),row=el('div','hist hmin','<div><b>'+md(h.period)+' ('+DOW[dow(h.period)]+') 주간 회의</b> <span class="sub" style="font-size:12px">'+weekNo(h.period)+'</span><div class="sub" style="font-size:12.5px">참석 '+esc((h.attendees||[]).join('·')||'—')+' · 저장 '+esc(h.savedAt||'')+(h.savedBy?' ('+esc(h.savedBy)+')':'')+'</div>'+(dec.length?'<div class="hdec">'+dec.slice(0,3).map(function(d){return '<div>'+esc(d)+'</div>'}).join('')+(dec.length>3?'<div class="sub">… 외 '+(dec.length-3)+'줄</div>':'')+'</div>':'')+'</div><span class="row" style="gap:6px"><button class="btn sm">보기</button></span>');
      row.onclick=function(){viewPastBoard_(h.period)};box.appendChild(row)});
    var back=el('div','hist','<div class="sub">현재 기간으로 돌아가기</div><span>→</span>');back.onclick=function(){S.period=S.boot.current;S.report=null;S.boot.closed=false;renderHeader();gs('wrListItems',S.period).then(function(x){if(x.ok){S.items=x.items;renderAll()}});setView('my')};box.appendChild(back)}
function viewPastBoard_(period){S._keepPast=true;S.period=period;S.report=null;S.minutes=null;S._pastIssKey=null;S._pastAll=null;S.boot.closed=false;renderHeader();gs('wrListItems',period).then(function(x){if(x.ok){S.items=x.items;renderAll()}});setView('board')}
function drawHistory(list){var box=$('#histList');box.innerHTML='';
  var curY=String((S.boot&&S.boot.current)||todayKst()).slice(0,4),ys={};ys[curY]=0;list.forEach(function(h){var y=String(h.period).slice(0,4);ys[y]=(ys[y]||0)+1});
  var years=Object.keys(ys).sort(function(a,b){return b<a?-1:1});if(!S.histYear||!(S.histYear in ys))S.histYear=curY;
  var bar=el('div','hyears');years.forEach(function(y){var un=list.filter(function(h){return String(h.period).slice(0,4)===y&&!h.finalAt}).length;var b=el('button','hy'+(y===S.histYear?' on':''),y+'년<small>'+ys[y]+'건</small>'+(un?'<i title="미확정 '+un+'건">'+un+'</i>':''));b.onclick=function(){S.histYear=y;drawHistory(list)};bar.appendChild(b)});box.appendChild(bar);
  var mine=list.filter(function(h){return String(h.period).slice(0,4)===S.histYear});
  if(!mine.length)box.appendChild(el('div','empty',S.histYear===curY?S.histYear+'년 보고가 아직 없습니다.':'이 해에 남은 보고가 없습니다.'));
  var pm='';mine.forEach(function(h){var m=+String(h.period).slice(5,7);if(m!==pm){box.appendChild(el('div','hmon',m+'월'));pm=m}
    var row=el('div','hist','<div><b>'+periodText(h.period)+'</b> <span class="sub" style="font-size:12px">'+weekNo(h.period)+'</span><div class="sub" style="font-size:13px">'+(h.finalAt?'확정 '+esc(h.finalAt)+' · 확정본 그대로 보관':'확정 전')+'</div></div><span class="row" style="gap:6px"><span class="tag '+(h.finalAt?'s-완료':'s-이슈')+'">'+(h.finalAt?'확정':'미확정')+'</span><button class="btn sm">보기</button></span>');row.onclick=function(){viewPast(h.period)};box.appendChild(row)});
  var back=el('div','hist','<div class="sub">현재 기간으로 돌아가기</div><span>→</span>');back.onclick=function(){S.period=S.boot.current;S.report=null;S.boot.closed=false;renderHeader();gs('wrListItems',S.period).then(function(x){if(x.ok){S.items=x.items;renderAll()}});setView('my')};box.appendChild(back);
}


boot();
